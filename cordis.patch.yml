# dsh-everos-memory — bundle patch.
#
# Mounts the plugin. Every field is `.volatile()`, so the settings page derives
# the form from the schema and changes apply without editing this file.
#
# `apiKey` is the EverOS **gateway** token, not a model key: the EverOS server
# has no auth of its own and the gateway is the trust boundary.
- insert:
    - id: everos-memory
      name: dsh-everos-memory
      config:
        enabled: true
        baseUrl: https://memory.mergio.app
        apiKey: ''
        userId: daneel
        appId: default
        projectId: default
        # End-only by default: nothing is extracted while you chat. The exchange
        # lands when the session is disposed, with a long safety window behind it.
        flushOnIdle: false
        idleSeconds: 300
        safeIdleSeconds: 1800
        minMessages: 1
        # Route writes through the server queue so its max_concurrency (1)
        # actually bounds extraction; synchronous flushes ignore that limit.
        asyncWrite: true
        maxConcurrentWrites: 1
        recall: true
        recallTopK: 3
        recallMinScore: 0.1
        recallTimeoutMs: 2000
        recallMaxChars: 1200
